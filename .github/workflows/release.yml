name: Release

# Manual release to Maven Central, triggered from the GitHub UI (Run workflow).
# The flow is: refuse to re-release an existing tag -> set the release version and
# commit + tag -> build, sign and publish to Central -> push -> create the GitHub
# release -> bump to the next -SNAPSHOT and commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.2.0), without -SNAPSHOT'
        required: true
        type: string
      nextVersion:
        description: 'Next development version (e.g. 2.3.0-SNAPSHOT). Leave empty to bump the last segment.'
        required: false
        type: string

# Only one release may run at a time, and never cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so `gh release --generate-notes` can diff against the previous tag.
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server id=central> whose credentials come
          # from these env vars, and imports the signing key for the maven-gpg-plugin.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.RELEASE_PGP_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Compute versions
        id: v
        run: |
          set -euo pipefail
          release="${{ inputs.version }}"
          release="${release#v}"
          release="${release%-SNAPSHOT}"
          next="${{ inputs.nextVersion }}"
          if [ -z "$next" ]; then
            # Bump the last dotted numeric segment: 2.2 -> 2.3, 2.2.0 -> 2.2.1.
            next="$(awk -F. -v OFS=. '{ $NF = $NF + 1; print }' <<< "$release")-SNAPSHOT"
          fi
          {
            echo "release=$release"
            echo "next=$next"
            echo "tag=v$release"
          } >> "$GITHUB_OUTPUT"
          echo "Release $release, tag v$release, next $next"

      - name: Refuse to re-release an existing tag
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists on origin — $tag has already been released."
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set release version, commit and tag
        run: |
          set -euo pipefail
          mvn -B -ntp versions:set -DnewVersion="${{ steps.v.outputs.release }}" -DgenerateBackupPoms=false
          git commit -am "release: JQF ${{ steps.v.outputs.release }}"
          git tag -a "${{ steps.v.outputs.tag }}" -m "JQF ${{ steps.v.outputs.release }}"

      # Build the AFL proxy so any native-backed tests match the CI environment.
      - name: Build AFL proxy
        run: make

      # Runs from the local release commit. Nothing has been pushed yet, so a failure here
      # leaves origin untouched and the workflow can simply be re-run.
      - name: Build, sign and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.RELEASE_PGP_PASSPHRASE }}
        run: mvn -B -ntp -Prelease clean deploy

      - name: Push release commit and tag
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.tag }}" --title "JQF ${{ steps.v.outputs.release }}" --generate-notes

      - name: Bump to next development version and commit
        run: |
          set -euo pipefail
          mvn -B -ntp versions:set -DnewVersion="${{ steps.v.outputs.next }}" -DgenerateBackupPoms=false
          git commit -am "prepare for next development iteration: ${{ steps.v.outputs.next }}"
          git push origin "HEAD:${{ github.ref_name }}"
